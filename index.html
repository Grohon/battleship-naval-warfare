
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship: Naval Warfare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'navy-900': '#0A192F',
              'navy-800': '#112240',
              'navy-700': '#233554',
              'slate-light': '#a8b2d1',
              'slate-DEFAULT': '#8892b0',
              'cyan-light': '#64ffda',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              pulse: {
                '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(100, 255, 218, 0.7)' },
                '50%': { transform: 'scale(1.02)', boxShadow: '0 0 10px 5px rgba(100, 255, 218, 0)' },
              },
              sunkFlash: {
                '0%': {
                  backgroundColor: 'hsl(163, 100%, 70%)',
                  transform: 'scale(1)'
                },
                '50%': {
                  backgroundColor: 'hsl(34, 97%, 64%)',
                  transform: 'scale(1.2)'
                },
                '100%': {
                  backgroundColor: '#991b1b', // equivalent to red-800
                  transform: 'scale(1)'
                },
              }
            },
            animation: {
              fadeIn: 'fadeIn 0.5s ease-in-out',
              pulse: 'pulse 2s infinite ease-in-out',
              sunkFlash: 'sunkFlash 0.8s ease-out forwards',
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-navy-900 text-slate-light font-sans">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
